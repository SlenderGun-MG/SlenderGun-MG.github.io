<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Caídas Asignadas - TR-eSport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --negro: #06060a; 
  --panel: #111115; 
  --panel2: #191922; 
  --campo: #0c0c14;
  --oro: #00ffff; 
  --rojo: #ff2d2d; 
  --rojo2: #ff4d4d;
  --gris: #9a9aab; 
  --gris-sutil: #6e6e80; 
  --linea: #25253a;
  --txt: #f4f4f8; 
  --ok: #28e97f;
  
  /* Variables de Logo y Marca de Agua */
  --logo-header-size: 80px;
  --watermark-img: none;
  --watermark-display: none;
  --watermark-size: 40%;
  --watermark-opacity: 0.1;

  --fd: 'Inter', system-ui, sans-serif; 
  --fm: 'Share Tech Mono', monospace; 
  --fh: 'Chakra Petch', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--negro); color: var(--txt); font-family: var(--fd); font-size: 14px; display: flex; justify-content: center; padding: 20px; transition: background 0.3s; }
input, select, button { font-family: inherit; }

/* ── Contenedor Principal ── */
.app-container { width: 100%; max-width: 1400px; background: transparent; }

/* ── Top Bar ── */
.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--linea); margin-bottom: 10px; background: var(--negro); border-radius: 8px 8px 0 0; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--fh); color: var(--oro); font-size: 1.2rem; font-weight: 700; text-transform: uppercase; }
.brand svg { width: 24px; height: 24px; fill: var(--oro); }

.top-buttons { display: flex; gap: 10px; }
.btn-top { background: var(--panel2); color: var(--txt); border: 1px solid var(--linea); padding: 8px 16px; font-family: var(--fh); font-weight: 700; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; text-transform: uppercase; transition: 0.2s; }
.btn-top:hover { border-color: var(--oro); }
.btn-cerrar { background: var(--rojo); color: white; border: none; }
.btn-cerrar:hover { background: var(--rojo2); border-color: var(--rojo2); }

/* ── Panel de Configuración ── */
.config-panel { display: none; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 20px; margin-bottom: 20px; gap: 30px; flex-wrap: wrap; }
.config-panel.active { display: flex; }
.config-section { display: flex; flex-direction: column; gap: 15px; flex: 1; min-width: 250px; }
.config-section h4 { font-family: var(--fh); color: var(--oro); text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px dashed var(--linea); padding-bottom: 5px; }

.color-group { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.color-group label { font-family: var(--fh); font-size: 0.85rem; color: var(--txt); text-transform: uppercase; flex: 1; }
.color-group input[type="color"] { width: 40px; height: 30px; border: 1px solid var(--linea); background: transparent; cursor: pointer; border-radius: 4px; padding: 0; }
.color-group input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--oro); }
.color-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--oro); }

.btn-reset-colors { background: transparent; border: 1px dashed var(--gris); color: var(--gris); padding: 8px 16px; font-family: var(--fh); font-size: 0.85rem; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: auto; }
.btn-reset-colors:hover { color: var(--txt); border-color: var(--txt); background: rgba(255,255,255,0.05); }

/* ── Área Capturable ── */
#capture-area { background: var(--negro); border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; padding-bottom: 20px; transition: background 0.3s, border-color 0.3s; }

/* ── Encabezado de la Tabla ── */
.table-header-ui { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--oro); background: var(--panel); transition: background 0.3s, border-color 0.3s; }

/* Logo de Organización */
.header-left { display: flex; align-items: center; gap: 15px; width: auto; min-width: 320px; }
.org-logo-upload { width: var(--logo-header-size); height: var(--logo-header-size); border: 1px dashed var(--oro); border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; background-size: contain; background-repeat: no-repeat; background-position: center; transition: 0.2s; overflow: hidden; flex-shrink: 0; }
.org-logo-upload:hover { background-color: rgba(255, 255, 255, 0.05); }
.org-logo-upload input { display: none; }
.org-logo-upload svg { width: 50%; height: 50%; fill: var(--oro); }
.inp-org-name { background: transparent; border: none; border-bottom: 1px dashed transparent; color: var(--oro); font-family: var(--fh); font-size: 1.4rem; font-weight: 700; width: 220px; outline: none; transition: 0.2s; }
.inp-org-name:focus { border-bottom-color: var(--oro); }

.header-center { flex: 1; text-align: center; }
.inp-main-title { background: transparent; border: none; color: var(--txt); font-family: var(--fh); font-size: 1.4rem; font-weight: 700; text-align: center; text-transform: uppercase; width: 100%; max-width: 400px; outline: none; }
.inp-main-title:focus { border-bottom: 1px dashed var(--oro); }

.header-right { display: flex; align-items: center; gap: 10px; width: 350px; justify-content: flex-end; }
.inp-date { background: transparent; border: none; color: var(--gris); font-family: var(--fd); font-size: 0.85rem; text-align: right; width: 180px; outline: none; }
.inp-date:focus { color: var(--txt); }

/* Botones de acción */
.action-btn { background: var(--oro); border: none; width: 36px; height: 36px; border-radius: 4px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; font-size: 1.2rem; }
.action-btn:hover { filter: brightness(1.2); transform: scale(1.05); }

/* ── Contenedor de la Tabla y Marca de Agua ── */
.table-wrapper { position: relative; width: 100%; min-height: 300px; }

/* Marca de Agua Overlay */
.watermark-overlay {
  display: var(--watermark-display);
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; /* Permite clics a través del logo hacia la tabla */
  background-image: var(--watermark-img);
  background-size: var(--watermark-size);
  background-position: center 60%;
  background-repeat: no-repeat;
  opacity: var(--watermark-opacity);
  z-index: 5;
}

/* ── Tabla de Caídas ── */
table { width: 100%; border-collapse: collapse; table-layout: fixed; position: relative; z-index: 2; }
th { font-family: var(--fh); color: var(--oro); font-size: 1rem; font-weight: 700; padding: 15px 10px; text-align: center; border-bottom: 1px solid var(--linea); border-right: 1px solid var(--linea); transition: color 0.3s, border-color 0.3s; }
th:last-child { border-right: none; }
td { border-bottom: 1px solid var(--linea); border-right: 1px solid var(--linea); padding: 0; height: 50px; background: var(--campo); transition: background 0.3s, border-color 0.3s; }
td:last-child { border-right: none; }

/* ── Inputs y Selects dentro de la tabla ── */
.num-cell { color: var(--txt); font-family: var(--fh); font-weight: 700; text-align: center; font-size: 1.1rem; }
.inp-team { width: 100%; height: 100%; background: transparent; border: none; color: var(--gris); text-align: center; font-family: var(--fd); font-size: 0.9rem; font-weight: 500; outline: none; }
.inp-team:focus { color: var(--txt); background: var(--panel); }

.select-drop { width: 100%; height: 100%; background: transparent; border: none; color: var(--gris); text-align: center; text-align-last: center; font-family: var(--fd); font-size: 0.9rem; outline: none; cursor: pointer; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
.select-drop:focus { color: var(--txt); background: var(--panel); }
.select-drop option { background: var(--negro); color: var(--txt); text-align: left; }

.select-wrapper { position: relative; width: 100%; height: 100%; }
.select-wrapper::after { content: '⌄'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--txt); pointer-events: none; font-size: 1.2rem; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Barra superior (Fuera del área de captura) -->
  <div class="top-bar">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg>
      TREINO LITE
    </div>
    <div class="top-buttons">
      <button class="btn-top" id="btnToggleConfig">⚙️ CONFIGURACIÓN</button>
      <button class="btn-top btn-cerrar" onclick="window.history.back()">✕ CERRAR MÓDULO</button>
    </div>
  </div>

  <!-- Panel de Configuración -->
  <div class="config-panel" id="configPanel">
    <!-- Ajustes de Logo -->
    <div class="config-section">
      <h4>Logo y Marca de Agua</h4>
      <div class="color-group">
        <label>Tamaño Encabezado (px)</label>
        <input type="range" id="sizeHeaderLogo" min="40" max="150" value="80">
      </div>
      <div class="color-group">
        <label>Marca de Agua en Tabla</label>
        <input type="checkbox" id="toggleWatermark">
      </div>
      <div class="color-group">
        <label>Tamaño Marca Agua (%)</label>
        <input type="range" id="sizeWatermark" min="10" max="100" value="40">
      </div>
      <div class="color-group">
        <label>Opacidad Marca Agua</label>
        <input type="range" id="opacityWatermark" min="1" max="100" value="10">
      </div>
    </div>

    <!-- Ajustes de Color -->
    <div class="config-section">
      <h4>Colores del Módulo</h4>
      <div class="color-group">
        <label>Acento (Textos/Botones)</label>
        <input type="color" class="color-picker" data-var="--oro" value="#00ffff">
      </div>
      <div class="color-group">
        <label>Fondo General</label>
        <input type="color" class="color-picker" data-var="--negro" value="#06060a">
      </div>
      <div class="color-group">
        <label>Fondo Cabecera</label>
        <input type="color" class="color-picker" data-var="--panel" value="#111115">
      </div>
      <div class="color-group">
        <label>Fondo Celdas</label>
        <input type="color" class="color-picker" data-var="--campo" value="#0c0c14">
      </div>
      <div class="color-group">
        <label>Líneas / Bordes</label>
        <input type="color" class="color-picker" data-var="--linea" value="#25253a">
      </div>
      <button class="btn-reset-colors" id="btnResetColors">↺ RESTABLECER TODO</button>
    </div>
  </div>

  <!-- Área que se exportará a Imagen -->
  <div id="capture-area">
    
    <div class="table-header-ui">
      <!-- Logo y Nombre Editable -->
      <div class="header-left">
        <label class="org-logo-upload" id="orgLogoContainer" title="Subir logo de tu equipo/organización">
          <input type="file" accept="image/*" id="orgLogoInput">
          <svg id="orgLogoIcon" viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 2h2v4h-2V5zm-4 4h2v10H7V9zm8 10h-2v-6h2v6zm4 0h-2V13h2v6z"/></svg>
        </label>
        <input type="text" class="inp-org-name" value="TR-eSport">
      </div>
      
      <div class="header-center">
        <input type="text" class="inp-main-title" value="TREINO ASCENSO">
      </div>
      
      <div class="header-right" data-html2canvas-ignore="true">
        <input type="text" class="inp-date" value="27/03/2026 | 9PM CO">
        <button class="action-btn" id="btnRandom" title="Aleatorio">🎲</button>
        <button class="action-btn" id="btnLimpiar" title="Limpiar Datos">🗑</button>
        <button class="action-btn" id="btnDescargar" title="Descargar Imagen">🖼</button>
      </div>
    </div>

    <div class="table-wrapper">
      <!-- Capa de la Marca de Agua (Se actualiza dinámicamente) -->
      <div class="watermark-overlay"></div>

      <table>
        <thead>
          <tr>
            <th style="width: 50px;">#</th>
            <th style="width: 200px;">Equipo</th>
            <th>Bermuda</th>
            <th>Purgatorio</th>
            <th>Nexterra</th>
            <th>Kalahari</th>
            <th>Solara</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Las filas se generan con JS -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
'use strict';

const root = document.documentElement;

/* ── CONFIGURACIÓN (Panel, Colores y Logo) ── */
const defaultColors = {
  '--oro': '#00ffff',
  '--negro': '#06060a',
  '--panel': '#111115',
  '--campo': '#0c0c14',
  '--linea': '#25253a'
};

// Alternar panel
document.getElementById('btnToggleConfig').addEventListener('click', () => {
  document.getElementById('configPanel').classList.toggle('active');
});

// Listener: Colores
document.querySelectorAll('.color-picker').forEach(picker => {
  picker.addEventListener('input', (e) => {
    root.style.setProperty(e.target.dataset.var, e.target.value);
  });
});

// Listener: Tamaño Logo Encabezado
document.getElementById('sizeHeaderLogo').addEventListener('input', (e) => {
  root.style.setProperty('--logo-header-size', `${e.target.value}px`);
});

// Listener: Activar/Desactivar Marca de Agua
document.getElementById('toggleWatermark').addEventListener('change', (e) => {
  root.style.setProperty('--watermark-display', e.target.checked ? 'block' : 'none');
});

// Listener: Tamaño Marca de Agua
document.getElementById('sizeWatermark').addEventListener('input', (e) => {
  root.style.setProperty('--watermark-size', `${e.target.value}%`);
});

// Listener: Opacidad Marca de Agua
document.getElementById('opacityWatermark').addEventListener('input', (e) => {
  root.style.setProperty('--watermark-opacity', e.target.value / 100);
});

// Restablecer TODO
document.getElementById('btnResetColors').addEventListener('click', () => {
  // Reset Colores
  for (const [key, value] of Object.entries(defaultColors)) {
    root.style.setProperty(key, value);
    const input = document.querySelector(`.color-picker[data-var="${key}"]`);
    if (input) input.value = value;
  }
  
  // Reset Tamaños
  document.getElementById('sizeHeaderLogo').value = 80;
  root.style.setProperty('--logo-header-size', '80px');
  
  document.getElementById('toggleWatermark').checked = false;
  root.style.setProperty('--watermark-display', 'none');
  
  document.getElementById('sizeWatermark').value = 40;
  root.style.setProperty('--watermark-size', '40%');
  
  document.getElementById('opacityWatermark').value = 10;
  root.style.setProperty('--watermark-opacity', '0.1');
});

/* ── LOGO DE ORGANIZACIÓN (Carga) ── */
document.getElementById('orgLogoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      const imgData = `url(${event.target.result})`;
      
      // Actualizar encabezado
      const container = document.getElementById('orgLogoContainer');
      container.style.backgroundImage = imgData;
      container.style.border = '1px solid var(--oro)'; 
      document.getElementById('orgLogoIcon').style.display = 'none';
      
      // Actualizar variable CSS de la marca de agua
      root.style.setProperty('--watermark-img', imgData);
    }
    reader.readAsDataURL(file);
  }
});

/* ── LOGICA DE LA TABLA Y MAPAS ── */
const MAPAS = {
  Bermuda: [
    "CAÍDA LIBRE", "Clock Tower", "Peak", "Factory", "Pochinok", "Bimasakti Strip", 
    "Mars Electric", "Hangar", "Mill", "Plantation", "Shipyard", "Riverside", 
    "Rim Nam Village", "Cape Town", "Katulistiwa", "Sentosa", "Keraton", 
    "Kota Tua", "Outpost", "Ranch", "Waterfront", "Graveyard", "Observatory", "Bullseye"
  ],
  Purgatorio: [
    "CAÍDA LIBRE", "Brasilia", "Central", "Marbleworks", "Golf Course", "Ski Lodge", 
    "Mt. Villa (Mountain Villa)", "Lumber Mill", "Fire Brigade", "Crossroads", 
    "Forge", "Moathouse", "Campsite"
  ],
  Nexterra: [
    "CAÍDA LIBRE", "Centro de Inteligencia", "Puente Gemelo", "Museo", "Ruinas del Mortero", 
    "Turbina", "Farmtopia", "Tirolesa", "Ciudad Oxidada", "Laboratorios de Gravedad", 
    "Plazaria", "Gimnasio de Boxeo", "Plaza Deca", "Zona de Lodo"
  ],
  Kalahari: [
    "CAÍDA LIBRE", "Bahía", "Comando", "Confinamiento", "Fundación", "Laberinto", 
    "La Subida", "Mamut", "Refinería", "Santa Catarina", "Piedra", "Aldea", 
    "Consejo", "Estación"
  ],
  Solara: [
    "CAÍDA LIBRE", "Centro", "Cascada", "Club de Jinetes", "Molino de Viento", "Arco", 
    "Feria", "Isla Delta", "Ciudad Florecida", "Torre de Televisión", "Estudio", 
    "Planta Ecológica", "Casa Vista", "Acuario", "Bahía"
  ]
};

const mapNames = Object.keys(MAPAS);
const tbody = document.getElementById('tableBody');

function generarTabla() {
  for (let i = 1; i <= 12; i++) {
    const tr = document.createElement('tr');
    
    const tdNum = document.createElement('td');
    tdNum.className = 'num-cell';
    tdNum.textContent = i;
    tr.appendChild(tdNum);

    const tdEquipo = document.createElement('td');
    tdEquipo.innerHTML = `<input type="text" class="inp-team" value="Equipo">`;
    tr.appendChild(tdEquipo);

    mapNames.forEach((mapName, mapIdx) => {
      const tdMap = document.createElement('td');
      let optionsHTML = MAPAS[mapName].map(opt => `<option value="${opt}">${opt}</option>`).join('');
      
      tdMap.innerHTML = `
        <div class="select-wrapper">
          <select class="select-drop" data-map="${mapIdx}">
            <option value="-" style="display:none;">-</option>
            ${optionsHTML}
          </select>
        </div>
      `;
      tdMap.querySelector('select').value = '-';
      tr.appendChild(tdMap);
    });

    tbody.appendChild(tr);
  }
}
generarTabla();

// Aleatorio
document.getElementById('btnRandom').addEventListener('click', () => {
  const selects = document.querySelectorAll('.select-drop');
  
  for (let mapIdx = 0; mapIdx < mapNames.length; mapIdx++) {
    const mapName = mapNames[mapIdx];
    const validSpots = MAPAS[mapName].filter(spot => spot !== "CAÍDA LIBRE");
    
    let pool = [];
    validSpots.forEach(spot => {
      pool.push(spot);
      pool.push(spot);
    });

    pool = pool.sort(() => Math.random() - 0.5);

    const selectsColumn = document.querySelectorAll(`.select-drop[data-map="${mapIdx}"]`);
    selectsColumn.forEach((select, rowIdx) => {
      select.value = pool[rowIdx] || "CAÍDA LIBRE";
      select.style.color = 'var(--txt)';
    });
  }
});

// Limpiar
document.getElementById('btnLimpiar').addEventListener('click', () => {
  if(!confirm('¿Restablecer la tabla de caídas?')) return;
  
  document.querySelectorAll('.select-drop').forEach(sel => {
    sel.value = '-';
    sel.style.color = 'var(--gris)';
  });
  document.querySelectorAll('.inp-team').forEach(inp => { inp.value = 'Equipo'; });
  document.querySelector('.inp-main-title').value = 'TREINO ASCENSO';
  
  // Limpiar Logo y Marca de agua
  const logoContainer = document.getElementById('orgLogoContainer');
  logoContainer.style.backgroundImage = 'none';
  logoContainer.style.border = '1px dashed var(--oro)';
  document.getElementById('orgLogoIcon').style.display = 'block';
  document.getElementById('orgLogoInput').value = '';
  document.querySelector('.inp-org-name').value = 'TR-eSport';
  
  root.style.setProperty('--watermark-img', 'none');
});

// Cambio de color en Select
document.querySelectorAll('.select-drop').forEach(sel => {
  sel.addEventListener('change', function() {
    this.style.color = this.value === '-' ? 'var(--gris)' : 'var(--txt)';
  });
});

// Descargar Imagen
document.getElementById('btnDescargar').addEventListener('click', () => {
  const area = document.getElementById('capture-area');
  
  const inputs = area.querySelectorAll('input');
  inputs.forEach(i => i.setAttribute('value', i.value));
  
  const currentBgColor = getComputedStyle(document.documentElement).getPropertyValue('--negro').trim();

  setTimeout(() => {
    html2canvas(area, {
      backgroundColor: currentBgColor,
      scale: 2
    }).then(canvas => {
      const link = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0,10);
      link.download = `Caidas_Asignadas_${dateStr}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }, 100);
});
</script>
</body>
</html>
