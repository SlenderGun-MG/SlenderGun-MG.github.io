<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Manager Elenco - TR-eSport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --negro: #06060a; --panel: #111115; --panel2: #191922; --campo: #22222d;
  --oro: #ffcc00; --rojo: #ff2d2d; --rojo2: #ff4d4d;
  --gris: #9a9aab; --gris-sutil: #6e6e80; --linea: #2a2a38;
  --txt: #f4f4f8; --ok: #28e97f;
  --fd: 'Inter', system-ui, sans-serif; 
  --fm: 'Share Tech Mono', monospace; 
  --fh: 'Chakra Petch', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--negro); color: var(--txt); font-family: var(--fd); font-size: 14px; padding: 20px; overflow-x: hidden; }
input, select, button { font-family: inherit; }

/* ── Contenedor Principal ── */
.app-container { max-width: 1400px; margin: 0 auto; background: #0c0c10; border: 1px solid var(--linea); border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

/* ── Encabezado de Empresa / Equipo ── */
.top-header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 20px 25px; margin-bottom: 25px; flex-wrap: wrap; gap: 20px; }
.team-info { display: flex; align-items: center; gap: 20px; }
.logo-box { width: 80px; height: 80px; background: var(--panel2); border: 1px dashed var(--gris-sutil); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: 0.2s; }
.logo-box:hover { border-color: var(--oro); }
.logo-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
.logo-box span { font-size: 1.5rem; color: var(--gris-sutil); }

.team-texts { display: flex; flex-direction: column; gap: 5px; }
.inp-team-name { background: transparent; border: none; color: var(--txt); font-family: var(--fh); font-size: 1.8rem; font-weight: 700; text-transform: uppercase; width: 320px; }
.inp-team-name:focus { outline: none; border-bottom: 1px solid var(--oro); }
.inp-season { background: transparent; border: none; color: var(--oro); font-family: var(--fh); font-size: 1rem; font-weight: 700; width: 200px; }
.inp-season:focus { outline: none; border-bottom: 1px solid var(--oro); }

.budget-area { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.sel-currency { background: var(--negro); border: 1px solid var(--oro); color: var(--oro); font-family: var(--fh); font-weight: 700; font-size: 0.85rem; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
.budget-display { background: var(--negro); border: 1px solid var(--linea); border-radius: 8px; padding: 12px 25px; text-align: right; min-width: 220px; }
.budget-display span { display: block; font-family: var(--fh); font-size: 0.7rem; color: var(--gris); text-transform: uppercase; letter-spacing: 0.08em; }
.budget-display strong { font-family: var(--fm); font-size: 1.5rem; color: var(--txt); }

/* ── Estructura Principal: Cards y Funciones ── */
.main-layout { display: grid; grid-template-columns: 1fr 280px; gap: 25px; align-items: start; }
.lineup-section { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 20px; }
.section-title { font-family: var(--fh); font-size: 0.95rem; color: var(--oro); font-weight: 700; text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

/* ── Grid de 7 Cuadros ── */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px; }
.player-card { background: var(--panel2); border: 1px solid var(--linea); border-radius: 8px; padding: 15px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; }
.card-label { font-family: var(--fh); font-size: 0.75rem; color: var(--gris); text-transform: uppercase; font-weight: 600; }
.avatar-box { width: 90px; height: 95px; background: var(--campo); border: 1px solid var(--linea); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: 0.2s; }
.avatar-box:hover { border-color: var(--oro); }
.avatar-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
.avatar-box svg { width: 32px; height: 32px; fill: #4a4a5a; }

.drop-role { width: 100%; background: #121218; border: 1px dashed #3a3a4d; border-radius: 6px; padding: 8px 4px; text-align: center; font-family: var(--fh); font-weight: 700; font-size: 0.75rem; color: var(--oro); text-transform: uppercase; min-height: 33px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.drop-role.drag-over { background: rgba(255, 204, 0, 0.15); border-color: var(--oro); }

.inp-name { width: 100%; background: var(--negro); border: 1px solid var(--linea); border-radius: 6px; padding: 8px; color: var(--txt); font-family: var(--fh); font-weight: 600; font-size: 0.85rem; text-align: center; text-transform: uppercase; }
.inp-name:focus { outline: none; border-color: var(--oro); }

.salary-control { display: flex; width: 100%; align-items: center; background: var(--negro); border: 1px solid var(--linea); border-radius: 6px; overflow: hidden; }
.btn-sal { background: #252530; border: none; color: var(--txt); font-weight: bold; width: 30px; height: 32px; cursor: pointer; font-size: 1rem; transition: 0.15s; }
.btn-sal:hover { background: #353545; color: var(--oro); }
.inp-salary { flex: 1; width: 100%; background: transparent; border: none; color: var(--ok); font-family: var(--fm); font-size: 0.9rem; font-weight: bold; text-align: center; }
.inp-salary:focus { outline: none; }

/* ── Panel Lateral: Funciones ── */
.functions-panel { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.func-title { font-family: var(--fh); font-size: 0.75rem; color: var(--gris); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
.role-item { background: var(--campo); border: 1px solid var(--linea); border-radius: 6px; padding: 12px; text-align: center; font-family: var(--fh); font-weight: 700; font-size: 0.85rem; color: var(--txt); cursor: grab; text-transform: uppercase; transition: 0.2s; user-select: none; }
.role-item:hover { border-color: var(--gris); transform: translateY(-2px); }
.role-item:active { cursor: grabbing; }

.btn-clear { margin-top: 15px; background: transparent; border: 1px solid var(--rojo); color: var(--rojo2); font-family: var(--fh); font-weight: 700; font-size: 0.8rem; padding: 12px; border-radius: 6px; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
.btn-clear:hover { background: var(--rojo); color: white; }

@media(max-width: 1024px) {
  .main-layout { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>
</head>
<body>

<div class="app-container">
  
  <!-- BOTÓN DE REGRESAR AL LOBBY -->
  <div style="margin-bottom: 15px;">
    <a href="index.html" style="text-decoration: none;">
      <button type="button" style="background: rgba(255, 45, 45, 0.1); border: 1px solid var(--rojo); color: var(--txt); padding: 8px 16px; font-family: var(--fh); font-weight: 700; font-size: 0.85rem; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: 0.2s;" onmouseover="this.style.background='var(--rojo)'" onmouseout="this.style.background='rgba(255, 45, 45, 0.1)'">⬅ REGRESAR AL LOBBY</button>
    </a>
  </div>

  <!-- Encabezado / Datos de Equipo -->
  <header class="top-header">
    <div class="team-info">
      <div class="logo-box" id="teamLogoBox" title="Subir logo del equipo">
        <span>↑</span>
        <img id="teamLogoImg" alt="Logo Equipo">
        <input type="file" id="inpTeamLogo" accept="image/*" style="display:none">
      </div>
      <div class="team-texts">
        <input type="text" class="inp-team-name" value="NOMBRE DE EQUIPO" placeholder="NOMBRE DE EQUIPO">
        <input type="text" class="inp-season" value="SEASON ####" placeholder="SEASON ####">
      </div>
    </div>

    <div class="budget-area">
      <select class="sel-currency">
        <option value="USD">DÓLAR (GLOBAL)</option>
        <option value="MXN">PESO (MXN)</option>
      </select>
      <div class="budget-display">
        <span>PRESUPUESTO TOTAL</span>
        <strong id="valTotalBudget">$ 0,00 USD</strong>
      </div>
    </div>
  </header>

  <!-- Cuerpo de la Gestión -->
  <div class="main-layout">
    
    <!-- 7 Cuadros del Elenco -->
    <section class="lineup-section">
      <div class="section-title">👤 LINE-UP PRINCIPAL</div>
      <div class="cards-grid" id="lineupGrid">
        <!-- Generado dinámicamente: 6 Jugadores + 1 Manager -->
      </div>
    </section>

    <!-- Panel Lateral de Funciones -->
    <aside class="functions-panel">
      <div class="func-title">FUNCIONES</div>
      <div class="role-item" draggable="true" data-role="RUSH">RUSH</div>
      <div class="role-item" draggable="true" data-role="RUSH 2">RUSH 2</div>
      <div class="role-item" draggable="true" data-role="CPT / IGL">CPT / IGL</div>
      <div class="role-item" draggable="true" data-role="BOMBA">BOMBA</div>
      <div class="role-item" draggable="true" data-role="SNIPER">SNIPER</div>
      <div class="role-item" draggable="true" data-role="SUPORTE">SUPORTE</div>
      <div class="role-item" draggable="true" data-role="CORINGA">CORINGA</div>

      <button class="btn-clear" id="btnClear">🗑️ LIMPIAR DATOS</button>
    </aside>

  </div>

</div>

<script>
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const ROSTER_CONFIG = [
  { label: 'JUGADOR 1' },
  { label: 'JUGADOR 2' },
  { label: 'JUGADOR 3' },
  { label: 'JUGADOR 4' },
  { label: 'JUGADOR 5' },
  { label: 'JUGADOR 6' },
  { label: 'MANAGER' }
];

// ── Renderizar las 7 Tarjetas ──
function renderRoster() {
  const grid = $('#lineupGrid');
  grid.innerHTML = ROSTER_CONFIG.map((item, idx) => `
    <div class="player-card" data-idx="${idx}">
      <span class="card-label">${item.label}</span>
      
      <div class="avatar-box" onclick="triggerImgUpload(${idx})" title="Subir foto">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <img id="img-player-${idx}" alt="">
        <input type="file" id="inp-file-${idx}" accept="image/*" style="display:none" onchange="previewPlayerImg(event, ${idx})">
      </div>

      <div class="drop-role" data-idx="${idx}">ARRASTRE ROL</div>

      <input type="text" class="inp-name" placeholder="NOMBRE...">

      <div class="salary-control">
        <button class="btn-sal" onclick="modificarSalario(${idx}, -50)">-</button>
        <input type="number" class="inp-salary" value="0" min="0" step="50" oninput="calcularPresupuesto()">
        <button class="btn-sal" onclick="modificarSalario(${idx}, 50)">+</button>
      </div>
    </div>
  `).join('');

  initDragAndDrop();
}

// ── Subir Imagen de Equipo ──
$('#teamLogoBox').addEventListener('click', () => $('#inpTeamLogo').click());
$('#inpTeamLogo').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = $('#teamLogoImg');
    img.src = reader.result;
    img.style.display = 'block';
    $('#teamLogoBox span').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

// ── Subir Foto de Jugador ──
window.triggerImgUpload = idx => $(`#inp-file-${idx}`).click();
window.previewPlayerImg = (e, idx) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = $(`#img-player-${idx}`);
    img.src = reader.result;
    img.style.display = 'block';
    img.previousElementSibling.style.display = 'none'; // Oculta ícono SVG
  };
  reader.readAsDataURL(file);
};

// ── Control de Salarios y Presupuesto ──
window.modificarSalario = (idx, delta) => {
  const card = $(`.player-card[data-idx="${idx}"]`);
  const inp = card.querySelector('.inp-salary');
  let actual = parseFloat(inp.value) || 0;
  actual = Math.max(0, actual + delta);
  inp.value = actual;
  calcularPresupuesto();
};

window.calcularPresupuesto = () => {
  let total = 0;
  $$('.inp-salary').forEach(inp => {
    total += parseFloat(inp.value) || 0;
  });
  
  const currency = $('.sel-currency').value;
  const formato = new Intl.NumberFormat('es-ES', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(total);

  $('#valTotalBudget').textContent = `$ ${formato} ${currency}`;
};

$('.sel-currency').addEventListener('change', calcularPresupuesto);

// ── Drag & Drop de Roles ──
function initDragAndDrop() {
  let draggedRole = '';

  $$('.role-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      draggedRole = e.target.getAttribute('data-role');
      e.dataTransfer.setData('text/plain', draggedRole);
    });
  });

  $$('.drop-role').forEach(zone => {
    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('drag-over');
    });

    zone.addEventListener('dragleave', () => {
      zone.classList.remove('drag-over');
    });

    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if (draggedRole) {
        zone.textContent = draggedRole;
        zone.style.color = '#fff';
        zone.style.borderColor = 'var(--oro)';
        zone.style.background = 'rgba(255, 204, 0, 0.1)';
      }
    });
  });
}

// ── Botón Limpiar Datos ──
$('#btnClear').addEventListener('click', () => {
  if (!confirm('¿Estás seguro de limpiar todos los nombres, salarios, roles e imágenes?')) return;
  
  // Limpiar Equipo
  $('.inp-team-name').value = 'NOMBRE DE EQUIPO';
  $('.inp-season').value = 'SEASON ####';
  $('#teamLogoImg').style.display = 'none';
  $('#teamLogoImg').src = '';
  $('#teamLogoBox span').style.display = 'block';

  // Reiniciar Tarjetas
  renderRoster();
  calcularPresupuesto();
});

// ── Inicialización ──
renderRoster();
calcularPresupuesto();
</script>
</body>
</html>
